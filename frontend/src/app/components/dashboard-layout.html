<div class="app-shell">
  <aside class="sidebar">
    <app-brand />
    <nav aria-label="Mon espace">
      <div class="nav-section">MON ESPACE</div>
      <a class="nav-link" routerLink="/profil" routerLinkActive="active"
        ><svg
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-5 3-8 8-8s8 3 8 8" /></svg
        >Mon profil</a
      >
      <a class="nav-link" routerLink="/devenir-proprietaire" routerLinkActive="active"
        ><svg
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M3 11 12 4l9 7v10H3Z" />
          <path d="M10 21v-7h4v7" /></svg
        >Espace propriétaire</a
      >
      <div class="nav-section">COMPTE</div>
      <button class="nav-link" type="button" (click)="signOut()" [disabled]="leaving()">
        <svg
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M10 17l5-5-5-5M15 12H3M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7" /></svg
        >{{ leaving() ? 'Déconnexion…' : 'Se déconnecter' }}
      </button>
    </nav>
    <div class="side-bottom">
      <strong class="sm"><span class="tiny-dot"></span> Un seul compte</strong>
      <p class="fine muted">Immovia simplifie chaque étape de votre parcours immobilier.</p>
    </div>
  </aside>
  <main class="app-main" id="main-content">
    <header class="topbar">
      <div class="breadcrumb">
        Mon espace <span>/</span> <strong>{{ title() }}</strong>
      </div>
      <div class="top-actions">
        @if (profiles.profile(); as profile) {
          <span class="smallchip">{{
            profile.owner ? 'Compte propriétaire' : 'Compte utilisateur'
          }}</span>
        }
        <div class="avatar" aria-hidden="true">{{ initials() }}</div>
      </div>
    </header>
    <app-feedback [error]="error()" />
    <ng-content />
  </main>
</div>
