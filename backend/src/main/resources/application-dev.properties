# Activer avec SPRING_PROFILES_ACTIVE=supabase,dev ; jamais avec prod.
spring.config.activate.on-profile=dev & !prod
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.immovia.controller
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=
