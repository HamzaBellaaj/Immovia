server.port=${SERVER_PORT:8000}

spring.application.name=immovia-backend
spring.profiles.default=supabase
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:${SUPABASE_URL:https://koihgmmtxqlbuexewurx.supabase.co}/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:${SUPABASE_URL:https://koihgmmtxqlbuexewurx.supabase.co}/auth/v1/.well-known/jwks.json}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Ne pas tracer les corps HTTP, les parametres SQL ou les jetons Bearer.
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.zaxxer.hikari=INFO

immovia.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Documentation desactivee hors du profil de developpement.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
